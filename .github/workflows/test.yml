name: ⭐️ Beam lint
# TODO: fix tests

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # services:
    #   postgres:
    #     image: postgres
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: illbuy
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          gleam-version: "1.10.0"
          rebar3-version: "3"
          # elixir-version: "1"
      # - run: psql -h 127.0.0.1 -p 5432 -U postgres -W postgres -d illbuy -f priv/migrations/*.sql
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      # - run: mv .env.ci .env
      - run: cd backend
      - run: gleam deps download
      # - run: gleam test
      - run: gleam format --check src test

      - run: cd ../frontend
      - run: gleam deps download
      # - run: gleam test
      - run: gleam format --check src test

      - run: cd ../shared
      - run: gleam deps download
      # - run: gleam test
      - run: gleam format --check src test
